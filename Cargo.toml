[workspace]
resolver = "2"
members = [
    "crates/buddyclip-core",
    "crates/buddyclip-cli",
    "crates/buddyclip-android",
]
default-members = [
    "crates/buddyclip-core",
    "crates/buddyclip-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Francesco Oddo"]

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
blake3 = { version = "1", features = ["pure"] }
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
dirs = "6"
hex = "0.4"
jni = "0.21"
log = "0.4"
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal", "process"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
